# Local Postgres for development and tests.
#
#   docker compose up -d
#   npm run setup
#
# Postgres rather than SQLite because the no-double-booking guarantee is an
# EXCLUDE constraint over a time range, which SQLite cannot express — see
# prisma/migrations/*_no_overlapping_bookings.

services:
  postgres:
    image: postgres:16-alpine
    container_name: picklelounge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: picklelounge
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
